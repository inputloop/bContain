[package]
name = "bvmm"
description = "bContain native VMM: bContain's own hypervisor (KVM on Linux, WHP on Windows)"
version.workspace = true
edition.workspace = true

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.25"
libc = "0.2"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
