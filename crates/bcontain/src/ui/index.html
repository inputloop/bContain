<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bContain</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6673; --line: #e2e5ea;
  --accent: #76b900; --accent-ink: #0b1400; --ok: #1f8a4c; --bad: #c43d3d; --warn: #a86b00;
  --chip: #eef1f4; --code: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1013; --panel: #161a1f; --ink: #e8ebef; --muted: #9aa3ae; --line: #262c34;
    --accent: #86cc0a; --accent-ink: #0b1400; --ok: #49c27a; --bad: #ef6b6b; --warn: #e2a33a;
    --chip: #1f252c; --code: #1b2026;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 14px; padding: 16px 24px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
.logo { font-weight: 750; font-size: 18px; letter-spacing: -.01em; }
.logo b { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.badge { white-space: nowrap; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); }
.badge.ok { color: var(--ok); } .badge.bad { color: var(--warn); }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px;
  display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.check { display: grid; grid-template-columns: 18px 88px 1fr; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check .i { font-weight: 700; } .check .i.ok { color: var(--ok); } .check .i.bad { color: var(--bad); }
.check .k { color: var(--muted); }
.check .v { overflow-wrap: anywhere; }
.check .fix { grid-column: 3; color: var(--warn); font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.state { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.running .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.kind { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); }
.src { color: var(--muted); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 5px 11px; border-radius: 7px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
input, select { font: inherit; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); min-width: 0; }
label.wide { grid-column: 1 / -1; }
.checkbox { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 13px; }
.msg { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
.msg.err { color: var(--bad); }
pre { background: var(--code); border-radius: 8px; padding: 12px; max-height: 320px; overflow: auto;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 0; white-space: pre-wrap; }
.empty { color: var(--muted); padding: 18px 6px; }
@media (max-width: 640px) {
  header { padding: 14px 16px; }
  .vmtable thead { display: none; }
  .vmtable tr { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .vmtable tr:first-child { border-top: 0; }
  .vmtable td { border: 0; padding: 0; }
  .vmtable td.num { text-align: left; color: var(--muted); }
  .vmtable td.src { grid-column: 2 / -1; max-width: none; }
  .vmtable td:last-child { grid-column: 1 / -1; }
  .vmtable .actions { justify-content: flex-start; }
  .vmtable .unit { display: inline; }
}
.unit { display: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo"><b>b</b>Contain</div>
    <div class="sub">VMs &amp; containers · tuned for RTX 3080 Ti · Core i9 · 32 GB</div>
  </div>
  <div class="spacer"></div>
  <span id="verdict" class="badge">checking…</span>
</header>
<main>
  <div class="stack">
    <section class="card">
      <h2>This machine</h2>
      <div id="checks"></div>
    </section>
    <section class="card">
      <h2>Presets on this host</h2>
      <table>
        <thead><tr><th>Preset</th><th class="num">vCPU</th><th class="num">RAM</th><th>Display</th></tr></thead>
        <tbody id="presets"></tbody>
      </table>
    </section>
  </div>
  <div class="stack">
    <section class="card">
      <h2>Machines</h2>
      <div class="scroll">
        <table class="vmtable">
          <thead><tr><th>Name</th><th>State</th><th>Kind</th><th class="num">vCPU</th><th class="num">RAM</th><th>Source</th><th></th></tr></thead>
          <tbody id="vms"></tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>New machine</h2>
      <form id="create">
        <label>Name <input name="name" required placeholder="ubuntu-dev" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}"></label>
        <label>Preset
          <select name="preset">
            <option value="">auto</option>
            <option>rtx3080ti</option><option>light</option><option>max</option><option>container</option>
          </select>
        </label>
        <label>Memory <input name="memory" placeholder="from preset"></label>
        <label>Ports <input name="ports" placeholder="8080:80, 2222:22"></label>
        <label class="wide">Image <input name="image" required placeholder="C:\ISOs\ubuntu-24.04.iso · disk.qcow2 · alpine:3.20 · app.tar"></label>
        <label class="checkbox"><input type="checkbox" name="legacy"> Windows guest (SATA + e1000e)</label>
        <div><button class="primary" type="submit">Create</button></div>
      </form>
      <div id="createMsg" class="msg"></div>
    </section>
    <section class="card" id="logCard" hidden>
      <h2 id="logTitle">Log</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gib = (mib) => (mib / 1024).toFixed(1) + " G";
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "X-Bcontain": "1", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
async function loadHost() {
  const h = await api("GET", "/api/host");
  const v = $("#verdict");
  v.textContent = h.meets_baseline ? "meets reference build" : "below reference build";
  v.className = "badge " + (h.meets_baseline ? "ok" : "bad");
  const rows = h.checks.map(c => `
    <div class="check"><span class="i ${c.ok ? "ok" : "bad"}">${c.ok ? "✔" : "✘"}</span>
      <span class="k">${esc(c.item)}</span><span class="v">${esc(c.found)}</span>
      ${c.fix ? `<span class="fix">${esc(c.fix)}</span>` : ""}</div>`);
  rows.push(`<div class="check"><span class="i ${h.qemu ? "ok" : "bad"}">${h.qemu ? "✔" : "✘"}</span>
    <span class="k">QEMU</span><span class="v">${h.qemu ? esc((h.qemu.version || "") + " · accel " + h.qemu.accel) : "not found"}</span></div>`);
  rows.push(`<div class="check"><span class="i ${h.kernel ? "ok" : "bad"}">${h.kernel ? "✔" : "•"}</span>
    <span class="k">Kernel</span><span class="v">${h.kernel ? "container kernel installed" : "run <span class=mono>bcontain kernel fetch</span>"}</span></div>`);
  $("#checks").innerHTML = rows.join("");
  $("#presets").innerHTML = h.presets.map(p => `<tr><td>${esc(p.name)}</td>
    <td class="num">${p.sizing.cpus}</td><td class="num">${gib(p.sizing.memory_mib)}</td>
    <td>${esc(p.sizing.display)}</td></tr>`).join("");
}
async function loadVms() {
  const vms = await api("GET", "/api/vms");
  if (!vms.length) { $("#vms").innerHTML = `<tr><td colspan="7" class="empty">No machines yet. Create one below.</td></tr>`; return; }
  $("#vms").innerHTML = vms.map(v => {
    const run = v.state === "running";
    return `<tr>
      <td><b>${esc(v.name)}</b></td>
      <td><span class="state ${run ? "running" : ""}"><span class="dot"></span>${esc(v.state)}</span></td>
      <td><span class="kind">${esc(v.kind)}</span></td>
      <td class="num">${v.cpus}<span class="unit"> vCPU</span></td><td class="num">${gib(v.memory_mib)}</td>
      <td class="src" title="${esc(v.source)}">${esc(v.source)}</td>
      <td><div class="actions">
        <button class="primary" data-act="start" data-n="${esc(v.name)}" ${run ? "disabled" : ""}>Start</button>
        <button data-act="stop" data-n="${esc(v.name)}" ${run ? "" : "disabled"}>Stop</button>
        <button data-act="log" data-n="${esc(v.name)}">Log</button>
        <button class="danger" data-act="delete" data-n="${esc(v.name)}" ${run ? "disabled" : ""}>Delete</button>
      </div></td></tr>`;
  }).join("");
}
$("#vms").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const n = b.dataset.n, act = b.dataset.act;
  try {
    if (act === "log") return showLog(n);
    if (act === "delete") { if (!confirm(`Delete ${n}? Disks bContain created for it are removed; your source image is kept.`)) return;
      await api("DELETE", `/api/vms/${encodeURIComponent(n)}`); }
    else await api("POST", `/api/vms/${encodeURIComponent(n)}/${act}`);
  } catch (err) { alert(err.message); }
  loadVms();
});
async function showLog(n) {
  $("#logCard").hidden = false; $("#logTitle").textContent = `Log · ${n}`;
  $("#log").textContent = (await api("GET", `/api/vms/${encodeURIComponent(n)}/log`)) || "(empty)";
}
$("#create").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target), msg = $("#createMsg");
  msg.className = "msg"; msg.textContent = "Creating… (pulling an image can take a minute)";
  try {
    const r = await api("POST", "/api/vms", {
      name: f.get("name"), image: f.get("image"), preset: f.get("preset"), memory: f.get("memory"),
      ports: String(f.get("ports") || "").split(",").map(s => s.trim()).filter(Boolean),
      legacy_devices: f.get("legacy") === "on" });
    msg.textContent = [...r.log, `Created ${r.name}.`].join("\n"); e.target.reset(); loadVms();
  } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
});
loadHost().catch(e => $("#checks").textContent = e.message);
loadVms();
setInterval(loadVms, 4000);
</script>
</body>
</html>
