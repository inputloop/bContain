[package]
name = "bcontain"
description = "Standalone VM + container runner tuned for RTX 3080 Ti / Core i9 / 32 GB laptops"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bcontain"
path = "src/main.rs"

[dependencies]
bvmm = { path = "../bvmm" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
dirs = "5"
