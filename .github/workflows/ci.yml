name: ci
# Manual only: the account has no Actions budget, so builds run locally
# (build-windows.cmd on Windows, scripts/package-linux.sh on Linux).
# Run it from the Actions tab if budget becomes available.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bcontain-linux-x86_64
          path: dist/bcontain-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: .\scripts\bundle-qemu-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: bContain-windows
          path: dist/bContain.exe
