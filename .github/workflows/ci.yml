name: ci
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bcontain-linux-x86_64
          path: dist/bcontain-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release
      - run: .\scripts\bundle-qemu-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: bcontain-windows
          path: dist/bcontain-windows.zip
